    # Markdown 源文件(研究页的「Markdown 源」链接):可读可下载,但**不参与检索**。
    # 为什么:与对应 HTML 页是同一份内容,被索引即构成重复内容、白耗抓取预算(SEO,2026-07-28)。
    # 顺带把 Content-Type 从默认的 application/octet-stream(强制下载)改成纯文本(浏览器直接看)。
    location ~* \.md$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    # 重资源(字体/图片/音视频):内容基本不变,一周缓存 + 重校验。
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|mp4|webm|mp3|wav)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    # 代码/数据(JS/CSS/JSON):随迭代原地更新,用 no-cache(每次条件请求校验,未变则 304)
    # ——避免浏览器缓存旧 app.js/styles.css 导致「改了不生效」。
    location ~* \.(css|js|mjs|json|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Netstall 支持页使用 /netstall，旧产品路径保持可访问。
    location = /netstall { try_files /netstall/index.html =404; }
    location = /netstall/ { return 301 /netstall$is_args$args; }
    location = /netstall/index.html { return 301 /netstall$is_args$args; }
    location = /cellprobe { return 301 /netstall$is_args$args; }
    location = /cellprobe/ { return 301 /netstall$is_args$args; }
    location = /cellprobe/index.html { return 301 /netstall$is_args$args; }

    # Dots 独立子域，主站路径仅作规范跳转。
    location = /dots { return 301 https://dots.vincejiang.com/; }
    location ^~ /dots/ { rewrite ^/dots/(.*)$ https://dots.vincejiang.com/$1 permanent; }

    # 301:skills 展示页已迁成博客文章 /blog/agent-skills/(链权搬家不蒸发)。
    location = /skills  { return 301 /blog/agent-skills/; }
    location ^~ /skills/ { return 301 /blog/agent-skills/; }
    # 301:双语从「独立 -en slug」改为「主页 + /en/ 子页」,旧英文 URL 搬家。
    location = /blog/fable-scaling-layering-en/ { return 301 /blog/fable-scaling-layering/en/; }
    location = /blog/fable-scaling-layering-en  { return 301 /blog/fable-scaling-layering/en/; }

    # 301:reactor-study 已整站迁至 reactor.vincejiang.com 子域(保留子路径,链权搬家)。
    location = /reactor-study  { return 301 https://reactor.vincejiang.com/; }
    location ^~ /reactor-study/ { rewrite ^/reactor-study/(.*)$ https://reactor.vincejiang.com/$1 permanent; }

    # 301:两个论文合集当初从 /blog/ 搬到 /research/ 时【没留 301】,旧 URL 一直在 404。
    # access-log 实测 43 天内 /blog/pension-demo* 被撞 328 次(Googlebot 占大头),
    # 等于把这批旧链接的权重直接丢掉。sitemap 与站内链接早已指向 /research/,只差这一跳。
    location ^~ /blog/pension-demo-revision/ { rewrite ^/blog/(pension-demo-revision/.*)$ /research/$1 permanent; }
    location ^~ /blog/pension-demo/          { rewrite ^/blog/(pension-demo/.*)$ /research/$1 permanent; }
    location = /blog/pension-demo-revision   { return 301 /research/pension-demo-revision/; }
    location = /blog/pension-demo            { return 301 /research/pension-demo/; }

    # HTML / 目录:干净 URL;目录回退到其 index.html;立即可见新版本。
    location / {
        try_files $uri $uri/ $uri.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 隐藏点文件(放行 ACME well-known)
    location ~ /\.(?!well-known) { deny all; }
}

# reactor.vincejiang.com — reactor-study 独立子域(整站根即原 /reactor-study/ 目录)。
# Traefik 的 *.vincejiang.com catch-all 已把该子域路由到本容器,按 Host 头分流到此块。
server {
    listen      80;
    listen      [::]:80;
    server_name reactor.vincejiang.com;

    root  /usr/share/nginx/html/reactor-study;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    # 埋点脚本:reactor 的页面写的是绝对路径 /assets/beacon.js,但本 server 的 root 是
    # reactor-study/ 子目录,于是解析成 reactor-study/assets/beacon.js —— 该文件只存在于
    # 主站根的 assets/ 下,故此前一直 404(access-log 实测 203 次/12 天,真人与 Googlebot 都有,
    # 等于 reactor 子域的访问统计一直没采到)。用 alias 指回主站那一份,避免复制造成两份副本。
    location = /assets/beacon.js {
        alias /usr/share/nginx/html/assets/beacon.js;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 301:树 v3 重构,三个节点迁移改 id(汇流拆分:防御入绿支/案例入案例带)
    location = /lesson/C04.html { return 301 /lesson/G01.html; }
    location = /lesson/C05.html { return 301 /lesson/G02.html; }
    location = /lesson/C06.html { return 301 /lesson/K01.html; }

    # 重资源:一周缓存 + 重校验(与主站同策略)
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|mp4|webm|mp3|wav)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    # 代码/数据:no-cache,改了立即生效
    location ~* \.(css|js|mjs|json|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 301:K00 案例库总览节点已裁撤(树减一层),旧链接引到案例带第一课
    location = /lesson/K00.html { return 301 /lesson/K01.html; }

    location / {
        try_files $uri $uri/ $uri.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\.(?!well-known) { deny all; }
}

# Dots 复用镜像和 Tunnel，只提供其独立静态目录。
server {
    listen 80;
    listen [::]:80;
    server_name dots.vincejiang.com;
    root /usr/share/nginx/html/dots;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://is1-ssl.mzstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    # 针对上线前被浏览器永久缓存的根路径 301，只清当前 origin 的网络缓存。
    # 不清 cookies/storage，不影响匿名反馈，也不触碰主站或其他子域。
    location = /refresh {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-store" always;
        return 302 https://dots.vincejiang.com/index.html;
    }
    location ~ ^/(feedback-state|media)\.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
