# site.conf — 容器内站点 server,覆盖 nginx:alpine 默认 default.conf。
# 监听 :80 明文(HTTPS 由 Cloudflare 边缘终止);geo-open(不拦内地);发布静态站。
# —— 规范主机(SEO,2026-07-28)——————————————————————————————————————
# 为什么:Traefik 路由是 HostRegexp `^(.+\.)?vincejiang.com$`,www./m./api./任意子域
# 统统落到本容器,此前一律 200 供应整站 —— 同一份内容在无数 host 下可达。
# canonical 标签只能保住「收录」,保不住「抓取预算」:实测 Applebot/GPTBot/bingbot
# 已在 www.* 上抓了数万次,新页因此排不进抓取队列(GSC 症状:大量「已发现-尚未编入索引」)。
# 故在源站把非规范 host 一律 301 收敛到主域。
# 豁免 localhost/127.0.0.1/空:容器健康检查用的就是这些 Host 头,跳走会导致 unhealthy。
map $host $canon_host_redir {
    default          1;
    "vincejiang.com"         0;
    "localhost"      0;
    "127.0.0.1"      0;
    ""               0;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 规范主机 301:置于最前(比 geoblock/内容都便宜,且避免非规范 host 上渲染任何内容)
    if ($canon_host_redir) { return 301 https://vincejiang.com$request_uri; }
    absolute_redirect off;   # 301/自动补斜杠用相对 Location,避免 http:// 绝对跳转(边缘是 https)

    # 健康检查:容器内 localhost 调用,供 Docker / Traefik 探活。
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # 安全头(server 级基线)
    include /etc/nginx/snippets/security-headers.conf;

    # Preserve the reviewed exhibition HTML; Cloudflare must not inject its RUM beacon.
    # https://developers.cloudflare.com/web-analytics/get-started/
    location = /gena2122/final-project-v2.0/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, no-cache, no-transform" always;
        try_files /gena2122/final-project-v2.0/index.html =404;
    }
    location = /gena2122/final-project-v2.0/index {
        return 301 /gena2122/final-project-v2.0/;
    }
    location = /gena2122/final-project-v2.0/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, no-cache, no-transform" always;
        try_files $uri =404;
    }

    # CSCI3150 current-only migration: keep old bookmarks, no parallel historical articles.
    location = "/study/2026T1/CSCI3150/L11-P2-高级分页-2026T1.html" { return 301 "/study/2026T1/CSCI3150/L11-P2-%E9%AB%98%E7%BA%A7%E5%88%86%E9%A1%B5.html$is_args$args"; }
