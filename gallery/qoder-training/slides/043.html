<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-55-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-65-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-85-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    :root {
      --bg: #0B0D08;
      --surface: #14180F;
      --blue: #3D8BFF;
      --lime: #E4FF32;
      --text: #F5F7EA;
      --text-2: #AEB69B;
      --border: #2B3120;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
      font-weight: 400;
    }

    .slide-container {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 48px 48px 42px 48px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .corner-accent {
      position: absolute;
      top: 28px;
      right: 32px;
      width: 14px;
      height: 14px;
      background: var(--blue);
      transform: rotate(45deg);
    }

    .slide-header {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 36px;
      align-items: end;
      padding-right: 34px;
      margin-bottom: 28px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-divider {
      width: 72px;
      height: 3px;
      background: var(--blue);
    }

    .slide-title {
      font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--blue);
    }

    .header-note {
      border-left: 3px solid var(--lime);
      padding: 6px 0 6px 20px;
      font-size: 24px;
      line-height: 1.45;
      font-weight: 500;
      color: var(--lime);
    }

    .card-grid {
      flex: 1;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--blue);
      padding: 26px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .card-item.c-lime {
      border-top-color: var(--lime);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-tile {
      width: 52px;
      height: 52px;
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      flex: 0 0 auto;
    }

    .c-lime .icon-tile {
      border-color: var(--lime);
      color: var(--lime);
    }

    .icon-tile svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-num {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-2);
    }

    .card-copy {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
      font-size: 28px;
      line-height: 1.18;
      font-weight: 700;
      color: var(--text);
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .mk {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      margin-top: 12px;
      background: var(--blue);
      transform: rotate(45deg);
    }

    .c-lime .mk {
      background: var(--lime);
    }

    .row p {
      font-size: 24px;
      line-height: 1.45;
      font-weight: 400;
      color: var(--text);
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 5px 12px;
      border: 1px solid var(--blue);
      font-size: 20px;
      line-height: 1.2;
      font-weight: 500;
      color: var(--blue);
    }

    .c-lime .card-tag {
      border-color: var(--lime);
      color: var(--lime);
    }
  </style>
</head>
<body>
  <main class="slide-container" aria-label="CLI 讲解口径">
    <div class="corner-accent" aria-hidden="true"></div>

    <header class="slide-header">
      <div class="title-block">
        <div class="section-divider" aria-hidden="true"></div>
        <h1 class="slide-title">CLI 讲解口径</h1>
      </div>
      <div class="header-note">把 CLI 讲成“可审计的执行入口”，而不是替代 Desktop 的黑盒自动化。</div>
    </header>

    <section class="card-grid" aria-label="CLI 培训口径三大要点">
      <article class="card-item">
        <div class="card-top">
          <div class="icon-tile" aria-hidden="true">
            <svg viewBox="0 0 40 40"><path d="M8 10h24v20H8z"/><path d="M13 17l5 3-5 3"/><path d="M21 24h6"/></svg>
          </div>
          <span class="card-num">01</span>
        </div>
        <div class="card-copy">
          <h2 class="card-title">推荐讲法</h2>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>“可审计的执行入口”是统一口径</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>先讲任务入口，再讲命令结构</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>强调可复现、可记录、可回放</p></div>
        </div>
        <div class="card-tag">训练重点</div>
      </article>

      <article class="card-item c-lime">
        <div class="card-top">
          <div class="icon-tile" aria-hidden="true">
            <svg viewBox="0 0 40 40"><path d="M20 8L33 31H7z"/><path d="M20 17v6"/><path d="M20 27.5v0.5"/></svg>
          </div>
          <span class="card-num">02</span>
        </div>
        <div class="card-copy">
          <h2 class="card-title">注意事项</h2>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>适合批量、重复、脚本化流程</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>不适合不明确、强交互任务</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>命令、输出、变更留痕并复审</p></div>
        </div>
        <div class="card-tag">判断与留痕</div>
      </article>

      <article class="card-item">
        <div class="card-top">
          <div class="icon-tile" aria-hidden="true">
            <svg viewBox="0 0 40 40"><path d="M20 7l11 5v8c0 7-4 11-11 13-7-2-11-6-11-13v-8l11-5z"/><path d="M15 20l4 4 6-7"/></svg>
          </div>
          <span class="card-num">03</span>
        </div>
        <div class="card-copy">
          <h2 class="card-title">边界</h2>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>讲清授权、路径与环境变量</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>越权动作回到人工确认</p></div>
          <div class="row"><span class="mk" aria-hidden="true"></span><p>Desktop 探索，CLI 承接稳定步骤</p></div>
        </div>
        <div class="card-tag">风险与协作</div>
      </article>
    </section>
  </main>
