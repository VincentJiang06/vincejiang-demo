body {
    margin: 0;
    padding: 0;
    background-color: #0B0D08;
    color: #F5F7EA;
    font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
    font-weight: 400;
    overflow: hidden;
}

.slide-container {
    width: 1280px;
    height: 720px;
    position: relative;
    background: #0B0D08;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Chrome: corner accent (contract: diamond, accent, 14px, top-right 32/28) */
.corner-accent {
    position: absolute;
    top: 28px;
    right: 32px;
    width: 14px;
    height: 14px;
    background: #FF3DBE;
    transform: rotate(45deg);
    z-index: 20;
}

/* Decorative chapter numeral — type as graphic mass */
.bg-num {
    position: absolute;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
    font-weight: 700;
    font-size: 420px;
    line-height: 1;
    color: #E4FF32;
    opacity: 0.06;
    z-index: 0;
    pointer-events: none;
    letter-spacing: -8px;
}

/* Content root: clears reservedGutter (top/bottom >= 24px) */
.content-wrapper {
    flex: 1;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 72px;
}

/* Top block: kicker + divider + title */
.kicker-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}
.kicker {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 6px;
    color: #E4FF32;
}
.kicker-side {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #AEB69B;
}
.section-divider {
    width: 72px;
    height: 3px;
    background: #FF3DBE;
    margin-bottom: 28px;
}
.slide-title {
    margin: 0;
    font-weight: 700;
    line-height: 1.18;
}
.ch-no {
    display: block;
    font-size: 42px;
    color: #E4FF32;
    letter-spacing: 10px;
    margin-bottom: 8px;
}
.ch-name {
    display: block;
    font-size: 108px;
    color: #F5F7EA;
    letter-spacing: 2px;
    line-height: 1.06;
}
.ch-name em {
    font-style: normal;
    color: #FF3DBE;
}

/* Thesis */
.main-thesis {
    margin: 0;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.55;
    color: #AEB69B;
    max-width: 860px;
}
.main-thesis .hl {
    color: #E4FF32;
    font-weight: 500;
}

/* Takeaways */
.takeaways {
    display: flex;
    gap: 24px;
    border-top: 1px solid #2B3120;
    padding-top: 28px;
}
.takeaway-item {

    background: #14180F;
    border: 1px solid #2B3120;
    padding: 22px 24px;
}
.takeaway-head {

    gap: 12px;
    margin-bottom: 12px;
}
.takeaway-index {
    font-size: 22px;
    font-weight: 700;
    color: #FF3DBE;
    letter-spacing: 2px;
}
.takeaway-mark {
    width: 10px;
    height: 10px;
    background: #E4FF32;
}
.takeaway-title {
    font-size: 24px;
    font-weight: 700;
    color: #F5F7EA;
    margin-left: auto;
}
.takeaway-text {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    color: #AEB69B;
}
