<style>
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-55-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-65-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Alibaba PuHuiTi 3.0'; src: url('../assets/fonts/AlibabaPuHuiTi-3-85-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  background-color: #0B0D08;
  font-family: 'Alibaba PuHuiTi 3.0', sans-serif;
  color: #F5F7EA;
  position: relative;
}

.corner-accent {
  position: absolute;
  top: 28px;
  right: 32px;
  width: 14px;
  height: 14px;
  background-color: #FF3DBE;
  transform: rotate(45deg);
}

.page {
  width: 100%;
  height: 100%;
  padding: 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.eyebrow {
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 3px;
  color: #E4FF32;
}

h1.slide-title {
  font-size: 40px;
  font-weight: 700;
  line-height: 1.18;
  color: #F5F7EA;
  margin-top: 8px;
}

.section-divider {
  width: 72px;
  height: 3px;
  background-color: #FF3DBE;
  margin-top: 14px;
}

.columns {
  flex: 1;
  display: flex;
  gap: 24px;
  min-height: 0;
}

.column {
  flex: 1;
  background-color: #14180F;
  border: 1px solid #2B3120;
  padding: 24px 26px 18px;
  display: flex;
  flex-direction: column;
}

.col-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom-style: solid;
  border-bottom-width: 3px;
  padding-bottom: 12px;
}

.col-name {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.18;
}

.col-tag {
  font-size: 20px;
  font-weight: 400;
  padding: 2px 10px;
  border: 1px solid;
}

.items {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 12px;
  padding-top: 6px;
}

.item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.item svg {
  flex: 0 0 22px;
  margin-top: 6px;
}

.item span {
  font-size: 24px;
  font-weight: 400;
  line-height: 1.45;
}

.column.left .item span { color: #AEB69B; }
.column.right .item span { color: #F5F7EA; }

.col-foot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #2B3120;
  font-size: 20px;
  font-weight: 400;
  color: #AEB69B;
  line-height: 1.4;
}

.takeaway {
  display: flex;
  align-items: center;
  gap: 16px;
  background-color: #14180F;
  border: 1px solid #2B3120;
  border-left: 4px solid #E4FF32;
  padding: 14px 22px;
}

.takeaway .tag {
  font-size: 20px;
  font-weight: 500;
  color: #E4FF32;
  white-space: nowrap;
}

.takeaway .txt {
  font-size: 24px;
  font-weight: 400;
  line-height: 1.4;
  color: #F5F7EA;
}
</style>
